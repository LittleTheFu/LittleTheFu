name: Update GitHub Stats

on:
  push:
    branches: [main]
    paths-ignore:
      - 'profile/**'
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Prepare output directory
        run: mkdir -p profile

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=LittleTheFu&show_icons=true&include_all_commits=true&show=contributions,all_time_contribs&hide=contribs"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate yearly contribution history
        run: python .github/scripts/generate_contribution_history.py

      - name: Commit updated stats cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/contributions-by-year.svg
          if git diff --cached --quiet; then
            echo "Stats card is already up to date."
            exit 0
          fi
          git commit -m "chore: update GitHub stats cards"
          git push
